<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlockyMod Studio</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ══════════ TOPBAR ══════════ -->
  <header class="topbar">
    <div class="logo">
      <img class="logo-img" src="assets/logo.png" alt="BlockyMod Studio logo" />
      <span class="logo-text">BlockyMod <em>Studio</em></span>
    </div>
    <div class="topbar-center">
      <span class="mod-badge" id="modBadge">Geen mod geladen</span>
    </div>
    <div class="topbar-actions">
      <button class="mc-btn mc-btn-ghost" id="btnProjects" title="Alle mods">📦 Mods</button>
      <button class="mc-btn mc-btn-green" id="btnExport" title="Exporteer de huidige mod als ZIP">⬇ Exporteer mod</button>
    </div>
  </header>

  <div class="shell">
    <!-- ══════════ SIDEBAR ══════════ -->
    <nav class="sidebar" id="sidebar">
      <button class="nav-item active" data-view="dashboard"><span class="nav-ico">🏠</span>Overzicht</button>
      <button class="nav-item" data-view="blocks"><span class="nav-ico">🧱</span>Blokken</button>
      <button class="nav-item" data-view="items"><span class="nav-ico">🗡️</span>Items</button>
      <button class="nav-item" data-view="workstations"><span class="nav-ico">🛠️</span>Werkbanken</button>
      <button class="nav-item" data-view="guis"><span class="nav-ico">🖼️</span>GUI's</button>
      <button class="nav-item" data-view="mobs"><span class="nav-ico">🐷</span>Mobs</button>
      <button class="nav-item" data-view="story"><span class="nav-ico">📖</span>Verhaal</button>
      <div class="nav-sep"></div>
      <button class="nav-item nav-item-accent" data-view="github"><span class="nav-ico">🤖</span>AI-code / GitHub<span class="nav-dot" id="githubDot" hidden></span></button>
      <div class="nav-footer">v1.1 &middot; Fabric 1.20.1 – 26.3</div>
    </nav>

    <!-- ══════════ HOOFDVENSTER ══════════ -->
    <main class="content" id="view"><!-- wordt door app.js gevuld --></main>
  </div>

  <!-- Toast-meldingen -->
  <div class="toast-wrap" id="toasts"></div>

  <!-- Modaal-venster -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal mc-panel" id="modalBox"></div>
  </div>

  <!-- Scriptvolgorde = afhankelijkheidsvolgorde -->
  <script src="js/util.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/state.js"></script>
  <script src="js/texture.js"></script>
  <script src="js/guidesign.js"></script>
  <script src="js/recipes.js"></script>
  <script src="js/exporters.js"></script>
  <script src="js/github.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
